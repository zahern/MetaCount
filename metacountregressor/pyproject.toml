[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metacountregressor"
dynamic = ["version"]
description = "JAX-first hierarchical search and fitting for count, CMF, duration, linear, and pavement CLR models."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  # JAX ecosystem — required for all model fitting and search
  # Lower bounds only so this stays compatible with SearchLibrium
  # (numpy>=2.0,<3, jax>=0.4.30) and HPC `zigenv` (numpy 2.3.x, jax 0.11.x).
  "jax>=0.4.30",
  "jaxlib>=0.4.30",
  "jaxopt>=0.8",
  # Scientific stack
  "joblib>=1.2",
  "latextable>=0.2",
  "matplotlib>=3.5",
  "numpy>=1.26.4,<3",
  "pandas>=1.5,<4",
  "psutil>=5.9",
  "scikit-learn>=1.1,<2",
  "scipy>=1.9,<2",
  "statsmodels>=0.13,<1",
  "texttable>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Single source of truth for the version: _version.py (__version__).
# Bump the number there only; the build metadata and runtime
# metacountregressor.__version__ both read from it, so they can no longer desync.
[tool.setuptools.dynamic]
version = { attr = "_version.__version__" }

[tool.setuptools]
include-package-data = true
py-modules = [
  "GA_CMF_AADT_JAX",
  "Solvers_METAJAX",
  "_version",
  "_device_cust",
  "_device_jax_cust",
  "_jax_config",
  "cmf_package",
  "data_split_helper",
  "experiment_package",
  "fitted_specifications",
  "halton",
  "help_guide",
  "helperprocess",
  "main_hpc",
  "main_hpc_lc_patch",
  "metaheuristics",
  "model_constraints",
  "output_config",
  "pareto_file",
  "pavement_clr",
  "regularization",
  "sample_data",
  "solution",
  "solvers_meta",
  "survival_models",
]

[tool.setuptools.packages.find]
include = ["metacountregressor*"]

[tool.setuptools.package-data]
metacountregressor = ["data/*.csv", "templates/*.ipynb", "scripts/*.py"]
