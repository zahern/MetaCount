[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metacountregressor"
dynamic = ["version"]
description = "JAX-first hierarchical search and fitting for count, CMF, duration, linear, and survival models."
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
authors = [
    { name = "Zeke Ahern" },
    { name = "Paul Corry" },
    { name = "Alexander Paz" },
]
keywords = [
    "count regression",
    "mixed models",
    "negative binomial",
    "poisson",
    "random effects",
    "metaheuristic",
    "traffic safety",
    "survival analysis",
    "aft models",
    "activity generation",
    "competing hazard",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core scientific stack — lower bounds only (plus generous major guards)
    # so this stays installable alongside SearchLibrium (numpy>=2.0,<3,
    # scipy>=1.10, jax>=0.4.30) and the HPC `zigenv` env (numpy 2.3.x,
    # scipy 1.15.x, jax 0.11.x, pandas 3.x, psutil 7.x, rich 14.x, ...).
    # Only bounds kept are for known future-major breaks, not current minors.
    "numpy>=1.26.4,<3",
    "scipy>=1.11,<2",
    "pandas>=2.1,<4",
    "psutil>=5.9",
    "scikit-learn>=1.3,<2",
    "statsmodels>=0.14,<1",
    "texttable>=1.7",
    "tabulate>=0.9",
    "latextable>=1.0",
    "requests>=2.31",
    "numexpr>=2.8",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "jaxopt>=0.8.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    # NOTE: the GIS / OR / CLI helpers below (geopandas, shapely, rasterio,
    # pyproj, openmatrix, larch, ortools, rich, typer, pyarrow, xarray,
    # tables) are NOT imported anywhere in the package (verified 2026-09-07:
    # only numpy/scipy/pandas/sklearn/statsmodels/matplotlib/seaborn/jax/
    # jaxopt/psutil/texttable/latextable are imported). They live in
    # [project.optional-dependencies] so `pip install metacountregressor`
    # does not force them onto zigenv / SearchLibrium envs.
]

[project.optional-dependencies]
bayesian = [
    "pymc>=5.0,<7.0",
    "arviz>=0.17,<1.0",
]
gpu = [
    "jax[cuda12]>=0.4.30",
    "jaxlib[cuda12]>=0.4.30",
]
# GIS / spatial helpers — not imported by core code; install only if needed.
# Upper bounds intentionally generous so zigenv (geopandas 1.1.x,
# xarray 2025.10.x, pyarrow 22.x) satisfies them.
gis = [
    "geopandas>=0.14",
    "shapely>=2.0",
    "rasterio>=1.3",
    "pyproj>=3.5",
    "xarray>=2023.6",
    "pyarrow>=14.0",
    "tables>=3.7",
    "openmatrix>=0.3.5",
    "larch>=6.0",
]
optim = [
    "ortools>=9.8",
]
cli = [
    "rich>=13.0",
    "typer>=0.9",
]
visualizer = [
    "flask>=2.3,<4.0",
    "geopandas>=0.14",
]
full = [
    "metacountregressor[gis]",
    "metacountregressor[optim]",
    "metacountregressor[cli]",
    "matsim-python>=0.1,<1.0",
    "flask>=2.3,<4.0",
]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.0,<5.0",
    "black>=23.0,<25.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.5,<2.0",
    "pre-commit>=3.0,<4.0",
]
docs = [
    "sphinx>=7.0,<8.0",
    "sphinx-rtd-theme>=1.3,<2.0",
    "myst-parser>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/zahern/MetaCount"
"Bug Tracker" = "https://github.com/zahern/MetaCount/issues"
"Tutorials" = "https://github.com/zahern/MetaCount#tutorials--resources"
Documentation = "https://github.com/zahern/MetaCount/blob/master/README.md"
Changelog = "https://github.com/zahern/MetaCount/releases"

[tool.setuptools.dynamic]
version = { file = "version.txt" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
metacountregressor = [
    "metacountregressor/data/*.csv",
    "metacountregressor/templates/*.ipynb",
    "metacountregressor/examples/*.py",
    "metacountregressor/examples/*.md",
    "data/*.csv",
    "examples/*.py",
    "examples/*.md",
]
"metacountregressor.metacountregressor" = [
    "templates/*.ipynb",
    "data/*.csv",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "metacountregressor",
    "metacountregressor.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PL", "T20"]
ignore = ["E501", "B008"]
per-file-ignores = { "tests/*" = ["S101", "SLF001"] }

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"