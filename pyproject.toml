[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metacountregressor"
dynamic = ["version"]
description = "JAX-first hierarchical search and fitting for count, CMF, duration, linear, and survival models."
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
authors = [
    { name = "Zeke Ahern" },
    { name = "Paul Corry" },
    { name = "Alexander Paz" },
]
keywords = [
    "count regression",
    "mixed models",
    "negative binomial",
    "poisson",
    "random effects",
    "metaheuristic",
    "traffic safety",
    "survival analysis",
    "aft models",
    "activity generation",
    "competing hazard",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26.4,<2.0.0",
    "scipy>=1.11,<1.14",
    "pandas>=2.1,<3.0",
    "psutil>=5.9,<7.0",
    "scikit-learn>=1.3,<2.0",
    "statsmodels>=0.14,<1.0",
    "texttable>=1.7,<2.0",
    "tabulate>=0.9,<2.0",
    "latextable>=1.0,<2.0",
    "requests>=2.31,<3.0",
    "psutil>=5.9,<7.0",
    "numexpr>=2.8,<3.0",
    "networkx>=3.0,<4.0",
    "matplotlib>=3.7,<4.0",
    "seaborn>=0.13,<1.0",
    "jax==0.4.30",
    "jaxlib==0.4.30",
    "jaxopt>=0.8.0",
    "ortools>=9.8,<10.0",
    "pyyaml>=6.0,<7.0",
    "tables>=3.7,<4.0",
    "pyarrow>=14.0,<18.0",
    "xarray>=2023.6,<2025.0",
    "geopandas>=0.14,<1.0",
    "shapely>=2.0,<3.0",
    "rasterio>=1.3,<2.0",
    "rasterio[gdal]>=1.3,<2.0",
    "pyproj>=3.5,<4.0",
    "openmatrix>=0.3.5,<1.0",
    "larch>=6.0,<7.0",
    "rich>=13.0,<14.0",
    "typer>=0.9,<1.0",
    "tqdm>=4.65,<5.0",
]

[project.optional-dependencies]
bayesian = [
    "pymc>=5.0,<7.0",
    "arviz>=0.17,<1.0",
]
gpu = [
    "jax[cuda12]==0.4.30",
    "jaxlib[cuda12]==0.4.30",
]
visualizer = [
    "flask>=2.3,<3.0",
    "geopandas>=0.14,<1.0",
]
full = [
    "jax==0.4.30",
    "jaxlib==0.4.30",
    "matsim-python>=0.1,<1.0",
    "flask>=2.3,<3.0",
    "geopandas>=0.14,<1.0",
]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.0,<5.0",
    "black>=23.0,<25.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.5,<2.0",
    "pre-commit>=3.0,<4.0",
]
docs = [
    "sphinx>=7.0,<8.0",
    "sphinx-rtd-theme>=1.3,<2.0",
    "myst-parser>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/zahern/MetaCount"
"Bug Tracker" = "https://github.com/zahern/MetaCount/issues"
"Tutorials" = "https://github.com/zahern/MetaCount#tutorials--resources"
Documentation = "https://github.com/zahern/MetaCount/blob/master/README.md"
Changelog = "https://github.com/zahern/MetaCount/releases"

[tool.setuptools.dynamic]
version = { file = "version.txt" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
metacountregressor = [
    "metacountregressor/data/*.csv",
    "metacountregressor/templates/*.ipynb",
    "metacountregressor/examples/*.py",
    "metacountregressor/examples/*.md",
    "data/*.csv",
    "examples/*.py",
    "examples/*.md",
]
"metacountregressor.metacountregressor" = [
    "templates/*.ipynb",
    "data/*.csv",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "metacountregressor",
    "metacountregressor.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PL", "T20"]
ignore = ["E501", "B008"]
per-file-ignores = { "tests/*" = ["S101", "SLF001"] }

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"